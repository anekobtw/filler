[tool.poetry]
name = "resume-filler-tools"
version = "0.1.0"
description = "Association discovery helper for outreach"
authors = ["Resume Filler user"]
packages = [{ include = "outreach" }]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"

[tool.poetry.scripts]
assoc = "outreach.associations:main"
cold-email = "outreach.email:main"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
