name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pipx install poetry
      - run: poetry check --lock
      - run: poetry build --output /tmp/resume-filler-python-dist
      - run: npm ci
      - run: cp resume.config.example.json resume.config.json
      - run: npm run typecheck
      - run: npm run build
